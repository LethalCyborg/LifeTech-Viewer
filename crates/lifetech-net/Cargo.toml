[package]
name = "lifetech-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lifetech-assets = { version = "0.1.0", path = "../lifetech-assets" }
lifetech-i18n = { version = "0.1.0", path = "../lifetech-i18n" }
lifetech-llsd = { version = "0.1.0", path = "../lifetech-llsd" }
lifetech-msg = { version = "0.1.0", path = "../lifetech-msg" }
lifetech-prim = { version = "0.1.0", path = "../lifetech-prim" }
lifetech-version = { version = "0.1.0", path = "../lifetech-version" }
base64 = "0.23.1"
bitflags = "2.13.2"
crossbeam-channel = "0.5.17"
glam = "0.34.1"
log = "0.4.34"
md5 = "0.8.1"
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["alloc"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webpki-root-certs = "1.0.9"

[dev-dependencies]
rcgen = "0.14.10"

[lints]
workspace = true
